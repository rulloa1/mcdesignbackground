<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael Chandler — Portfolio</title>
    <meta name="description" content="37+ years, $500M+ portfolio. Every project is a testament to precision, craftsmanship, and uncompromising standards.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['"Cormorant Garamond"', 'serif'],
                    },
                    colors: {
                        gold: '#D4AF37',
                        charcoal: '#1a1a1a',
                        offwhite: '#FAF9F6',
                        graytext: '#6B6B6B',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FAF9F6;
            color: #1a1a1a;
            scroll-behavior: smooth;
        }

        /* Navigation */
        nav.main-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(26, 26, 26, 0.85);
            backdrop-filter: blur(12px);
            z-index: 50;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav.main-nav .logo {
            font-family: 'Cormorant Garamond', serif;
            color: #D4AF37;
            font-size: 1.5rem;
            text-decoration: none;
            font-weight: 600;
        }

        nav.main-nav .links {
            display: flex;
            gap: 2rem;
        }

        nav.main-nav .links a {
            color: #fff;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-decoration: none;
            transition: color 0.3s;
        }

        nav.main-nav .links a:hover {
            color: #D4AF37;
        }

        /* Hero Stats */
        .hero-section {
            padding-top: 120px;
            padding-bottom: 4rem;
            text-align: center;
        }

        .stats-container {
            display: flex;
            justify-content: center;
            gap: 4rem;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .stat-item h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
            font-weight: 400;
        }

        .stat-item p {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #6B6B6B;
        }

        /* Featured Projects */
        .featured-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            padding: 0 2rem;
            margin-bottom: 4rem;
        }

        @media (max-width: 768px) {
            .featured-grid {
                grid-template-columns: 1fr;
            }
        }

        .featured-card {
            position: relative;
            height: 75vh;
            overflow: hidden;
            display: block;
            text-decoration: none;
        }

        .featured-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .featured-card:hover img {
            transform: scale(1.05);
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 3.5rem;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            color: white;
            transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .featured-badge {
            display: inline-block;
            background-color: #D4AF37;
            color: #1a1a1a;
            padding: 0.4rem 1rem;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }

        .featured-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            line-height: 1.1;
            margin-bottom: 0.5rem;
        }

        .featured-subtitle {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #e0e0e0;
        }

        .featured-specs {
            font-size: 0.9rem;
            color: #b0b0b0;
        }

        /* Filter System */
        .filter-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin: 4rem 2rem;
        }

        .filter-btn {
            border: 1px solid #1a1a1a;
            background: transparent;
            color: #1a1a1a;
            padding: 0.8rem 2rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-btn.active, .filter-btn:hover {
            background: #1a1a1a;
            color: white;
        }

        /* Project Grid */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 2rem;
            padding: 0 2rem 4rem;
        }

        @media (max-width: 480px) {
            .project-grid {
                grid-template-columns: 1fr;
            }
        }

        .project-card {
            position: relative;
            aspect-ratio: 3/4;
            overflow: hidden;
            display: block;
            text-decoration: none;
        }

        .project-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .project-card:hover img {
            transform: scale(1.08);
        }

        .project-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 2rem;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            color: white;
            transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .category-tag {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #D4AF37;
            margin-bottom: 0.5rem;
            display: block;
        }

        .project-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        .project-subtitle {
            font-size: 1rem;
            color: #d0d0d0;
            margin-bottom: 0.5rem;
        }

        .project-specs {
            font-size: 0.8rem;
            color: #a0a0a0;
        }

        /* Footer */
        footer {
            background: #1a1a1a;
            color: white;
            padding: 4rem 2rem;
            text-align: center;
        }

        .footer-logo {
            font-family: 'Cormorant Garamond', serif;
            color: #D4AF37;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .regions {
            color: #D4AF37;
            letter-spacing: 0.2em;
            font-size: 0.8rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .contact-info {
            font-size: 0.9rem;
            color: #a0a0a0;
        }

        /* Scroll animations */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .featured-card {
            transition-delay: 0s;
        }

        .featured-card:nth-child(2) {
            transition-delay: 0.2s;
        }

        .project-card {
            transition-delay: 0s;
        }

        .project-card:nth-child(2) { transition-delay: 0.1s; }
        .project-card:nth-child(3) { transition-delay: 0.2s; }
        .project-card:nth-child(4) { transition-delay: 0.3s; }
    </style>
</head>
<body>

    <nav class="main-nav">
        <a href="#" class="logo">mcdesign</a>
        <div class="links">
            <a href="#">Home</a>
            <a href="#">Work</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <section class="hero-section">
        <h1 class="font-serif text-5xl md:text-7xl mb-4">Portfolio</h1>
        <div class="stats-container">
            <div class="stat-item">
                <h3>19</h3>
                <p>Signature Projects</p>
            </div>
            <div class="stat-item">
                <h3>37+</h3>
                <p>Years Excellence</p>
            </div>
            <div class="stat-item">
                <h3>$500M+</h3>
                <p>Portfolio Value</p>
            </div>
        </div>
    </section>

    <!-- Featured Projects -->
    <section class="featured-grid" id="featured-grid"></section>

    <!-- Filter System -->
    <div class="filter-container" id="filter-container">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="residential-construction">Residential Construction</button>
        <button class="filter-btn" data-filter="design-build">Design Build</button>
        <button class="filter-btn" data-filter="civil">Civil</button>
        <button class="filter-btn" data-filter="hospitality">Hospitality</button>
        <button class="filter-btn" data-filter="residential-development">Residential Development</button>
    </div>

    <!-- Project Grid -->
    <section class="project-grid" id="project-grid"></section>

    <footer>
        <div class="footer-logo">mcdesign</div>
        <div class="regions">CA • Bahamas • TX • MT • UT • FL</div>
        <div class="contact-info">
            <p>Michael Chandler — Strategic Construction Executive</p>
            <p style="margin-top: 1rem;"><a href="mailto:contact@mcdesign.bio" style="color: #D4AF37; text-decoration: none;">contact@mcdesign.bio</a></p>
        </div>
    </footer>

    <script src="projects-data.js"></script>
    <script>
        // Render featured projects
        const featuredGrid = document.getElementById('featured-grid');
        const featuredProjects = projectsData.filter(p => p.featured);
        
        featuredProjects.forEach(project => {
            const card = document.createElement('a');
            card.href = `project-detail.html?id=${project.id}`;
            card.className = 'featured-card';
            card.innerHTML = `
                <img src="${project.coverImage}" alt="${project.title}">
                <div class="card-overlay">
                    <div class="featured-badge">★ FEATURED</div>
                    <h2 class="featured-title">${project.title.split(' ')[0]}</h2>
                    <div class="featured-subtitle">${project.subtitle}</div>
                    <div class="featured-specs">${project.location} <br> ${project.specs}</div>
                </div>
            `;
            featuredGrid.appendChild(card);
        });

        // Render all projects
        const projectGrid = document.getElementById('project-grid');
        
        function renderProjects(filter = 'all') {
            projectGrid.innerHTML = '';
            const filtered = filter === 'all' 
                ? projectsData 
                : projectsData.filter(p => p.category === filter);
            
            filtered.forEach(project => {
                const card = document.createElement('a');
                card.href = `project-detail.html?id=${project.id}`;
                card.className = 'project-card';
                card.setAttribute('data-category', project.category);
                card.innerHTML = `
                    <img src="${project.coverImage}" alt="${project.title}">
                    <div class="project-overlay">
                        <span class="category-tag">${project.category.replace('-', ' ')}</span>
                        <h3 class="project-title">${project.title}</h3>
                        <div class="project-subtitle">${project.subtitle}</div>
                        <div class="project-specs">${project.specs}</div>
                    </div>
                `;
                projectGrid.appendChild(card);
            });
        }

        // Initial render
        renderProjects();

        // Update stats
        document.querySelector('.stats-container').innerHTML = `
            <div class="stat-item">
                <h3>${projectsData.length}</h3>
                <p>Signature Projects</p>
            </div>
            <div class="stat-item">
                <h3>37+</h3>
                <p>Years Excellence</p>
            </div>
            <div class="stat-item">
                <h3>$500M+</h3>
                <p>Portfolio Value</p>
            </div>
        `;

        // Filtering Logic
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filterValue = btn.getAttribute('data-filter');
                renderProjects(filterValue);
            });
        });
    </script>
</body>
</html>
