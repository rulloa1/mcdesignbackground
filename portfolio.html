<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Michael Chandler — Portfolio</title>
        <meta name="description" content="37+ years, $500M+ portfolio. Every project is a testament to precision, craftsmanship, and uncompromising standards.">
        
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
        
        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ['Montserrat', 'sans-serif'],
                            serif: ['"Cormorant Garamond"', 'serif'],
                        },
                        colors: {
                            gold: '#D4AF37',
                            charcoal: '#1a1a1a',
                            offwhite: '#FAF9F6',
                            graytext: '#6B6B6B',
                        }
                    }
                }
            }
    </script>

    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        /* ── Film grain ───────────────────────────────────────────── */
        const grainCanvas = document.createElement('canvas');
        grainCanvas.width = grainCanvas.height = 256;
        const gc  = grainCanvas.getContext('2d');
        const id  = gc.createImageData(256, 256);
        const pix = id.data;
        for (let i = 0; i < pix.length; i += 4) {
            const v = Math.random() * 255 | 0;
            pix[i] = pix[i+1] = pix[i+2] = v;
            pix[i+3] = 20;
        }
        gc.putImageData(id, 0, 0);
        document.getElementById('grain-overlay').style.backgroundImage =
            `url(${grainCanvas.toDataURL('image/png')})`;

        /* ── DOM references ─────────────────────────────────────────── */
        const projectGrid     = document.getElementById('project-grid');
        const filterContainer = document.getElementById('filter-container');

        /* ── Character split helper ──────────────────────────────────── */
        const splitChars = (el) => {
            const raw  = el.textContent.trim();
            const html = [...raw].map(c =>
                c === ' '
                    ? ' '
                    : `<span class="par-char"><span>${c}</span></span>`
            ).join('');
            el.innerHTML = html;
            return [...el.querySelectorAll('.par-char span')];
        };

        /* ─ Generate project cards ─── */
        function displayProjects(filter = 'all') {
            projectGrid.innerHTML = '';
            const filteredProjects = (filter === 'all')
                ? projects
                : projects.filter(p => p.category === filter);

            filteredProjects.forEach(project => {
                const projectCard = `
                    <a href="${project.link}" class="project-card card-enter" data-category="${project.category}">
                        <img src="${project.imgSrc}" alt="${project.title}">
                        <div class="project-overlay">
                            <span class="category-tag">${project.category.replace(/-/g, ' ')}</span>
                            <h3 class="project-title">${project.title}</h3>
                            <div class="project-subtitle">${project.subtitle}</div>
                            <div class="project-specs">${project.specs}</div>
                        </div>
                    </a>
                `;
                projectGrid.innerHTML += projectCard;
            });
        }

        /* ── Event listener for filter buttons ────────────────────── */
        filterContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelector('.filter-btn.active').classList.remove('active');
                e.target.classList.add('active');
                displayProjects(e.target.dataset.filter);
            }
        });

        // Initial display of all projects
        displayProjects();

        /* ═══════════════════════════════════════════════════════════ */
        /*  Portfolio animation suite                                   */
        /* ═══════════════════════════════════════════════════════════ */

        function initPortfolioAnimations() {

            /* ── Hero title text wipe (left→right on load) ── */
            const heroInner = document.querySelector('#hero-title .text-wipe-inner');
            if (heroInner) {
                gsap.to(heroInner, {
                    scaleX: 1, transformOrigin: 'left center',
                    duration: 1.3, ease: 'power3.inOut', delay: 0.2,
                });
            }

            /* ── Hero title: character stagger after wipe ── */
            if (heroInner) {
                const heroChars = splitChars(heroInner);
                if (heroChars.length) {
                    gsap.fromTo(heroChars,
                        { yPercent: 110, opacity: 0 },
                        {
                            yPercent: 0, opacity: 1, duration: 0.8,
                            stagger:  { amount: 0.42 },
                            ease:     'power2.out', delay: 0.55,
                        }
                    );
                }
            }

            /* ── Stats: slide-up entrance ── */
            const statItems = document.querySelectorAll('.stat-slide');
            gsap.set(statItems, { opacity: 0, y: 44 });
            gsap.to(statItems, {
                opacity: 1, y: 0,
                stagger:  { amount: 0.38 },
                duration: 0.95,
                ease:     'power3.out',
                scrollTrigger: {
                    trigger: '#stats-trigger',
                    start:   'top 88%',
                    toggleActions: 'play none none reverse',
                }
            });

            /* ── Featured cards: entrance + parallax ── */
            const featuredCards = document.querySelectorAll('.featured-card');
            gsap.set(featuredCards, { opacity: 0, y: 60 });
            gsap.to(featuredCards, {
                opacity: 1, y: 0,
                stagger:  { amount: 0.45 },
                duration: 1.1,
                ease:     'power3.out',
                scrollTrigger: {
                    trigger: '#featured-trigger',
                    start:   'top 85%',
                    toggleActions: 'play none none reverse',
                }
            });

            /* Parallax inner overlay labels */
            gsap.to('.card-overlay', {
                yPercent: -12,
                ease:     'none',
                scrollTrigger: {
                    trigger: '#featured-trigger',
                    start:   'top bottom',
                    end:     'bottom top',
                    scrub:   1.6,
                }
            });

            /* ── Featured card overlay text: character stagger ── */
            const ftHeadings = document.querySelectorAll('.featured-title[data-split]');
            ftHeadings.forEach(h => {
                const chars = splitChars(h);
                gsap.fromTo(chars,
                    { yPercent: 120, opacity: 0 },
                    {
                        yPercent: 0, opacity: 1, duration: 0.7,
                        stagger:  { amount: 0.35 },
                        ease:     'power2.out',
                        scrollTrigger: {
                            trigger: h.closest('.featured-card'),
                            start:   'top 82%',
                            toggleActions: 'play none none reverse',
                        }
                    }
                );
            });

            /* ── Filter buttons: staggered entrance ── */
            const filterBtns = document.querySelectorAll('.filter-btn');
            gsap.set(filterBtns, { opacity: 0, y: 20 });
            gsap.to(filterBtns, {
                opacity: 1, y: 0,
                stagger:  { amount: 0.35 },
                duration: 0.65,
                ease:     'power2.out',
                scrollTrigger: {
                    trigger: '#filter-container',
                    start:   'top 90%',
                    toggleActions: 'play none none reverse',
                }
            });

            /* ── Project grid: staggered card entrance ── */
            gsap.fromTo('.card-enter',
                { opacity: 0, y: 50, scale: 0.97 },
                {
                    opacity: 1, y: 0, scale: 1,
                    duration: 0.85,
                    stagger:  { amount: 0.5, from: 'start' },
                    ease:     'power3.out',
                    clearProps: 'transform',
                    scrollTrigger: {
                        trigger: '.project-grid',
                        start:   'top 92%',
                        toggleActions: 'play none none reverse',
                    }
                }
            );

            /* ── Footer logo: character stagger ── */
            const footerLogo = document.querySelector('.footer-logo[data-split]');
            if (footerLogo) {
                const logoChars = splitChars(footerLogo);
                gsap.fromTo(logoChars,
                    { yPercent: 120, opacity: 0 },
                    {
                        yPercent: 0, opacity: 1, duration: 0.9,
                        stagger:  { amount: 0.5 },
                        ease:     'power3.out',
                        scrollTrigger: {
                            trigger: '#footer-trigger',
                            start:   'top 88%',
                            toggleActions: 'play none none reverse',
                        }
                    }
                );
            }

            /* ── Region line: character stagger + floating parallax ── */
            const regionEl = document.querySelector('[data-par-regions]');
            if (regionEl) {
                const regText = regionEl.textContent.trim();
                const spaced  = [...regText].map(c =>
                    c === ' ' ? '&nbsp;&nbsp;' : c
                ).join('');
                regionEl.innerHTML = `<span class="par-char"><span>${spaced}</span></span>`;

                gsap.fromTo(regionEl.querySelectorAll('.par-char span'),
                    { opacity: 0, y: 20 },
                    {
                        opacity: 1, y: 0, duration: 1.2,
                        stagger:  { amount: 0.45 },
                        ease:     'power2.out',
                        scrollTrigger: {
                            trigger: '#footer-trigger',
                            start:   'top 90%',
                            toggleActions: 'play none none reverse',
                        }
                    }
                );

                gsap.to('[data-par-regions]', {
                    yPercent: -18,
                    ease:     'none',
                    scrollTrigger: {
                        trigger: '#footer-trigger',
                        start:   'top bottom',
                        end:     'bottom top',
                        scrub:   2,
                    }
                });
            }

            /* ── Contact info: slide entrance ── */
            const contactEl = document.getElementById('contact-trigger');
            if (contactEl) {
                gsap.set(contactEl, { opacity: 0 });
                gsap.to(contactEl, {
                    opacity: 1,
                    duration: 1.0,
                    ease:     'power2.out',
                    scrollTrigger: {
                        trigger: contactEl,
                        start:   'top 90%',
                        toggleActions: 'play none none reverse',
                    }
                });
            }
        }

        /* ── Initialise on DOMContentLoaded ──────────────────────── */
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPortfolioAnimations);
        } else {
            initPortfolioAnimations();
        }

</body>
</html>
