<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Design | Motion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        carbon: '#0E0E0E',
                        brass: '#C9A961',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0E0E0E; color: white; margin: 0; overflow-x: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; object-fit: cover; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="bg-carbon selection:bg-white selection:text-carbon">

    <!-- Scroll Section -->
    <section class="relative w-full h-[600vh]">
        <div class="sticky top-0 w-full h-screen overflow-hidden">
            <canvas id="animation-canvas"></canvas>
            
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none p-10 text-center">
                <h1 class="text-6xl md:text-8xl font-light tracking-tight opacity-0" id="main-title">
                    Brutal Minimalism.
                </h1>
                <p class="mt-4 text-xl font-light text-gray-400 opacity-0" id="sub-title">
                    Experience Phase 2 performance.
                </p>
            </div>
        </div>
    </section>

    <!-- Content Section -->
    <section class="relative z-10 w-full min-h-screen flex items-center justify-center p-20 bg-carbon border-t border-white/5">
        <div class="max-w-4xl space-y-8">
            <h2 class="text-4xl md:text-5xl font-light">Engineered for sub-1s load.</h2>
            <p class="text-lg text-gray-400 leading-relaxed font-light">
                This canvas pipeline eliminates DOM bloat, rendering each frame of your V-Ray sequence directly to the buffer for a seamless, Apple-grade user experience.
            </p>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const canvas = document.getElementById("animation-canvas");
        const context = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const frameCount = 294;
        const currentFrame = index => `/frames/frame_${index.toString().padStart(3, '0')}.webp`;

        const images = [];
        const sequence = { frame: 0 };

        // Preload Logic
        for (let i = 0; i < frameCount; i++) {
            const img = new Image();
            img.src = currentFrame(i);
            images.push(img);
        }

        const render = () => {
            const img = images[sequence.frame];
            if (!img || !img.complete) return;

            context.clearRect(0, 0, canvas.width, canvas.height);
            
            const canvasRatio = canvas.width / canvas.height;
            const imgRatio = img.width / img.height;
            let drawWidth, drawHeight, offsetX, offsetY;

            if (canvasRatio > imgRatio) {
                drawWidth = canvas.width;
                drawHeight = canvas.width / imgRatio;
                offsetX = 0;
                offsetY = (canvas.height - drawHeight) / 2;
            } else {
                drawWidth = canvas.height * imgRatio;
                drawHeight = canvas.height;
                offsetX = (canvas.width - drawWidth) / 2;
                offsetY = 0;
            }

            context.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
        };

        const tl = gsap.timeline({
            scrollTrigger: {
                trigger: "section",
                start: "top top",
                end: "bottom bottom",
                scrub: 0.5,
            }
        });

        tl.to(sequence, {
            frame: frameCount - 1,
            snap: "frame",
            ease: "none",
            onUpdate: render,
        });

        // Text reveal effects
        tl.to("#main-title", { opacity: 1, y: -20, duration: 2 }, 0.1);
        tl.to("#main-title", { opacity: 0, y: -40, duration: 2 }, 0.7);
        tl.to("#sub-title", { opacity: 1, y: -20, duration: 2 }, 0.2);
        tl.to("#sub-title", { opacity: 0, y: -40, duration: 2 }, 0.6);

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            render();
        });

        images[0].onload = render;
    </script>
</body>
</html>
